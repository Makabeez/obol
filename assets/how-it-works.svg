<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="How Obol works: pays x402 sellers, scores them, writes verdicts on-chain, other agents read before paying">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1c1a"/>
      <stop offset="1" stop-color="#081413"/>
    </linearGradient>
    <radialGradient id="coin" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#e7c777"/>
      <stop offset="55%" stop-color="#caa253"/>
      <stop offset="100%" stop-color="#7c6a39"/>
    </radialGradient>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#caa253"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fb39a"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb0a4"/>
    </marker>
    <style>
      .box{fill:#0f2421;stroke:#1d352e;stroke-width:1.5}
      .hl{stroke:#caa253}
      .t{font-family:Georgia,'Times New Roman',serif;fill:#ece6d6;font-size:21px;font-weight:700}
      .s{font-family:Georgia,serif;fill:#9fb0a4;font-size:15px;font-style:italic}
      .m{font-family:ui-monospace,'SF Mono',Menlo,monospace;fill:#caa253;font-size:12px;letter-spacing:1px}
      .n{font-family:ui-monospace,'SF Mono',Menlo,monospace;fill:#081413;font-size:13px;font-weight:700}
      .step{font-family:ui-monospace,'SF Mono',Menlo,monospace;fill:#ece6d6;font-size:14px}
      .dim{fill:#9fb0a4}
      .head{font-family:ui-monospace,'SF Mono',Menlo,monospace;fill:#9fb0a4;font-size:12px;letter-spacing:3px}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" fill="none" stroke="#1d352e"/>
  <text x="40" y="34" class="head">HOW OBOL WORKS · LIVE ON ARC MAINNET</text>

  <!-- boxes -->
  <g>
    <rect x="40" y="56" width="210" height="112" rx="8" class="box"/>
    <text x="145" y="96" text-anchor="middle" class="t">x402 seller</text>
    <text x="145" y="121" text-anchor="middle" class="s">your paid endpoint</text>
    <text x="145" y="149" text-anchor="middle" class="m">HTTP 402 · USDC</text>

    <rect x="350" y="56" width="210" height="112" rx="8" class="box hl"/>
    <text x="455" y="96" text-anchor="middle" class="t">Obol</text>
    <text x="455" y="121" text-anchor="middle" class="s">buyer agent</text>
    <text x="455" y="149" text-anchor="middle" class="m">ERC-8004 #345</text>

    <rect x="660" y="56" width="210" height="112" rx="8" class="box"/>
    <text x="765" y="96" text-anchor="middle" class="t">Reputation</text>
    <text x="765" y="121" text-anchor="middle" class="s">registry on Arc</text>
    <text x="765" y="149" text-anchor="middle" class="m">0xDCaf…30BE</text>

    <rect x="970" y="56" width="190" height="112" rx="8" class="box"/>
    <text x="1065" y="96" text-anchor="middle" class="t">Any agent</text>
    <text x="1065" y="121" text-anchor="middle" class="s">about to pay</text>
    <text x="1065" y="149" text-anchor="middle" class="m">obol-kit</text>
  </g>

  <!-- 1: Obol pays the seller -->
  <line x1="350" y1="88" x2="254" y2="88" stroke="#caa253" stroke-width="2" marker-end="url(#ag)"/>
  <circle cx="302" cy="88" r="12" fill="#caa253"/><text x="302" y="93" text-anchor="middle" class="n">1</text>
  <circle r="6" cx="346" cy="88" opacity="0" fill="url(#coin)">
    <animate attributeName="cx" values="346;258" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 2: seller answers -->
  <line x1="250" y1="138" x2="346" y2="138" stroke="#9fb0a4" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <circle cx="298" cy="138" r="12" fill="#9fb0a4"/><text x="298" y="143" text-anchor="middle" class="n">2</text>

  <!-- 3: verdict on-chain -->
  <line x1="560" y1="112" x2="656" y2="112" stroke="#4fb39a" stroke-width="2" marker-end="url(#at)"/>
  <circle cx="608" cy="112" r="12" fill="#4fb39a"/><text x="608" y="117" text-anchor="middle" class="n">3</text>

  <!-- 4: agents read before paying -->
  <line x1="970" y1="112" x2="874" y2="112" stroke="#4fb39a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#at)"/>
  <circle cx="920" cy="112" r="12" fill="#4fb39a"/><text x="920" y="117" text-anchor="middle" class="n">4</text>

  <!-- 5: agents pay the sellers that deliver -->
  <path d="M1065,168 C1065,252 145,252 145,172" fill="none" stroke="#caa253" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#ag)"/>
  <circle cx="605" cy="231" r="12" fill="#caa253"/><text x="605" y="236" text-anchor="middle" class="n">5</text>

  <!-- steps -->
  <g transform="translate(40,290)">
    <text class="step" y="0"><tspan fill="#caa253">1</tspan>  Obol pays the seller per call in USDC on Arc <tspan class="dim">(EIP-3009 exact or Circle Gateway batched)</tspan></text>
    <text class="step" y="25"><tspan fill="#9fb0a4">2</tspan>  the seller answers; Obol scores it <tspan class="dim">(delivered? fresh? worth the price?)</tspan></text>
    <text class="step" y="50"><tspan fill="#4fb39a">3</tspan>  the verdict goes on-chain with the payment as evidence; sellers that keep failing are retired</text>
    <text class="step" y="75"><tspan fill="#4fb39a">4</tspan>  any agent reads the record before it spends <tspan class="dim">(obol-kit: checkBeforePay)</tspan></text>
    <text class="step" y="100"><tspan fill="#caa253">5</tspan>  and pays the sellers that deliver: <tspan class="dim">good sellers get more buyers, bad ones get skipped</tspan></text>
  </g>
</svg>
